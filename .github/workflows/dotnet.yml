name: .NET 10 CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore ArchenaAI.Common.slnx

      - name: Build kernel
        run: dotnet build src/ArchenaAI.Common.Semantic.Kernel/ArchenaAI.Common.Semantic.Kernel.csproj --configuration Release --no-restore

      - name: Build runtime
        run: dotnet build src/ArchenaAI.Common.Semantic.Runtime/ArchenaAI.Common.Semantic.Runtime.csproj --configuration Release --no-restore

      - name: Build MCP governance
        run: dotnet build src/ArchenaAI.Common.MCP/ArchenaAI.Common.MCP.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ArchenaAI.Common.Kernel.Tests/ArchenaAI.Common.Kernel.Tests.csproj --configuration Release --no-restore
